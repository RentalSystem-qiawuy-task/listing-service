services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: listing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-RoomRental}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - listing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  listing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listing-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8084}:8084"
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT:-8084}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}

      # Database — point to the sibling postgres container
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-RoomRental}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
      SCHEMA_NAME: ${SCHEMA_NAME:-listing_service}

      # Cloudflare R2 Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET:-signify}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      STORAGE_IMAGE_MAX_SIZE: ${STORAGE_IMAGE_MAX_SIZE:-5242880}

      # Kafka — use shared broker on the rental-net network
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-listing-service}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES:-10}

      # Kafka topics
      PROPERTY_EVENTS_TOPIC: ${PROPERTY_EVENTS_TOPIC:-property.events}
      CONTRACT_EVENTS_TOPIC: ${CONTRACT_EVENTS_TOPIC:-contract.events}
      KAFKA_CONSUMER_RETRY_INTERVAL_MS: ${KAFKA_CONSUMER_RETRY_INTERVAL_MS:-1000}
      KAFKA_CONSUMER_RETRY_COUNT: ${KAFKA_CONSUMER_RETRY_COUNT:-3}
      KAFKA_SEND_TIMEOUT_SECONDS: ${KAFKA_SEND_TIMEOUT_SECONDS:-10}

      # Outbox scheduler
      OUTBOX_POLL_DELAY_MS: ${OUTBOX_POLL_DELAY_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_DELAY_SECONDS: ${OUTBOX_RETRY_DELAY_SECONDS:-5}
      ROOM_PRICE_ANNOUNCEMENT_CRON: ${ROOM_PRICE_ANNOUNCEMENT_CRON:-0 5 0 * * *}

      # Snowflake ID
      SNOWFLAKE_GENERATOR_ID: ${SNOWFLAKE_GENERATOR_ID:-0}

      # API docs
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}

      # Service discovery (Eureka)
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}

      # Actuator
      ACTUATOR_EXPOSED_ENDPOINTS: ${ACTUATOR_EXPOSED_ENDPOINTS:-health,info}
    networks:
      - default
      - rental-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  rental-net:
    external: true
    name: rental-system_rental-net

volumes:
  listing_postgres_data:
    driver: local